<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Redirecting...</title>
    <script>
      ;((location) => {
        const pathSegmentsToKeep = 0
        const basePath = location.pathname
          .split('/')
          .slice(0, pathSegmentsToKeep + 1)
          .join('/')
        const routePath = location.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~')
        const query = location.search
          ? `&${location.search.slice(1).replace(/&/g, '~and~')}`
          : ''

        location.replace(
          `${location.origin}${basePath}/?/${routePath}${query}${location.hash}`
        )
      })(window.location)
    </script>
  </head>
  <body>
    <noscript>This page requires JavaScript to open the requested article.</noscript>
  </body>
</html>
